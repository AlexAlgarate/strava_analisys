[project]
name = "strava-analisys"
version = "0.1.0"
description = "Tool to analyze your running workouts using Strava's API"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Alex Algarate", email = "alex.algarate@gmail.com" }]
dependencies = [
    "aiohttp>=3.14.3",
    "cryptography>=50.0.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]
[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "import-linter>=2.15",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
    "ty>=0.0.79",
]
[project.urls]
Homepage = "https://github.com/AlexAlgarate"

[tool.ruff]
target-version = "py313"
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg", ".ipynb_checkpoints",
    ".nox", ".pants.d", ".pyenv", ".pytest_cache", ".pytype",
    ".ruff_cache", ".svn", ".tox", ".venv", ".vscode", "__pypackages__",
    "_build", "buck-out", "build", "dist", "node_modules", "site-packages", "venv"
]
line-length = 88
indent-width = 4

[tool.ruff.lint]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["main", "src"]

[tool.coverage.report]
fail_under = 95
precision = 2
show_missing = true

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
all = "error"
