[project]
name = "strava-analisys"
version = "0.1.0"
description = "Tool to analyze your running workouts using Strava's API"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Alex Algarate", email = "alex.algarate@gmail.com" }]
dependencies = [
    "aiohttp>=3.12.0",
    "cryptography>=45.0.4",
    "pandas>=2.3.0",
    "python-dotenv>=1.1.0",
    "requests>=2.32.4",
]
[dependency-groups]
dev = [
    "aioresponses>=0.7.8",
    "coverage>=7.9.1",
    "freezegun>=1.5.1",
    "import-linter>=2.3",
    "pandas-stubs>=2.2.3.250308",
    "pre-commit>=4.2.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.11.13",
    "ty>=0.0.79",
    "types-requests>=2.32.4.20250611",
]
[project.urls]
Homepage = "https://github.com/AlexAlgarate"

[tool.ruff]
target-version = "py313"
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg", ".ipynb_checkpoints",
    ".nox", ".pants.d", ".pyenv", ".pytest_cache", ".pytype",
    ".ruff_cache", ".svn", ".tox", ".venv", ".vscode", "__pypackages__",
    "_build", "buck-out", "build", "dist", "node_modules", "site-packages", "venv"
]
line-length = 88
indent-width = 4

[tool.ruff.lint]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.ty.environment]
python-version = "3.13"
